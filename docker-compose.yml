services:
  postgres:
    image: postgres:16-alpine
    container_name: smartinvoice-db
    environment:
      POSTGRES_DB: smartinvoice
      POSTGRES_USER: smartinvoice
      POSTGRES_PASSWORD: SmartInvoice@Dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartinvoice"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartinvoice-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
